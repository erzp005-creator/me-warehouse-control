site_name: ME Warehouse Control
site_description: Warehouse work allocation, timing, receiving evidence and accountability
site_url: https://erzp005-creator.github.io/me-warehouse-control/
repo_url: https://github.com/erzp005-creator/me-warehouse-control
repo_name: erzp005-creator/me-warehouse-control

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Instrument Sans
    code: JetBrains Mono
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - ME Work Control: me-warehouse-control.md
  - Railway Cloud: railway-deployment.md
  - API Reference: api-reference.md
  - Deployment: deployment.md
  - Admin Panel: admin-panel.md
  - Connectors: connectors.md
  - ERP Integration: erp-integration.md
  - Transfer Orders: transfer-orders.md
  - Test Lab: test-lab.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
